[build-system]
requires = ["setuptools>=61.0", "wheel"]


build-backend = "setuptools.backends.legacy:build"

[project]
name = "vivent-client"
version = "0.1.0"
description = "A client library for Vivent"
readme = "README.md"
requires-python = ">=3.13"
license = { text = "MIT" }
dependencies = [
    "certifi==2026.5.20",
    "charset-normalizer==3.4.7",
    "idna==3.18",
    "requests==2.34.2",
    "urllib3==2.7.0",
]

[project.urls]
Homepage = "https://github.com/your-username/vivent-client"
